// Contrato gRPC do Arquipélago: AG distribuído (modelo de ilhas) para o TSP.
//
// Todos os nós executam o mesmo serviço. O papel (líder/coordenador ou
// trabalhador) é decidido em tempo de execução pelo algoritmo do Valentão
// (Bully). Toda mensagem entre nós carrega um Header com o relógio de Lamport
// do remetente e o mandato (term) do líder que ele conhece.

syntax = "proto3";

package arquipelago;

message Header {
  int64 lamport = 1;    // relógio lógico de Lamport no momento do envio
  int32 sender_id = 2;  // id do nó remetente
  int64 term = 3;       // mandato do líder conhecido pelo remetente
  double phys_time = 4; // relógio físico sincronizado (Berkeley) do remetente
}

message NodeInfo {
  int32 id = 1;
  string address = 2;   // "ip:porta" do servidor gRPC do nó
  int32 incarnation = 3; // incrementado a cada reinício do processo
  string host = 4;       // nome do computador (informativo)
  string machine = 5;    // processador e núcleos (informativo, para o relatório)
}

message Ack {
  Header h = 1;
  bool ok = 2;
  string info = 3;
}

message Empty {}

message JsonReply {
  string json = 1;
}

// ---------------------------------------------------------------- pertencimento

message JoinRequest {
  Header h = 1;
  NodeInfo node = 2;
  string seen_address = 3; // endereço que o solicitante usou para alcançar quem responde
}

message JoinReply {
  Header h = 1;
  bool accepted = 2;           // true somente se quem respondeu é o líder
  NodeInfo responder = 3;
  int32 leader_id = 4;         // dica: líder conhecido por quem respondeu (0 = nenhum)
  string leader_address = 5;
  repeated NodeInfo members = 6;
}

message PingRequest {
  Header h = 1;
  bytes payload = 2;
}

message PingReply {
  Header h = 1;
  NodeInfo node = 2;
  int32 leader_id = 3;
}

message PeerRequest {
  string address = 1;
}

// ---------------------------------------------------------------- eleição (Bully)

message ElectionRequest {
  Header h = 1;
  NodeInfo candidate = 2;
}

message ElectionReply {
  Header h = 1;
  bool ok = 2; // "OK": tenho id maior, estou vivo e assumo a eleição
}

message CoordinatorAnnounce {
  Header h = 1;
  NodeInfo leader = 2;
}

// ---------------------------------------------------------------- detecção de falhas

message IslandRoute {
  int32 island_id = 1;
  int32 node_id = 2;
  string address = 3;
}

message HeartbeatRequest {
  Header h = 1;
  NodeInfo leader = 2;
  repeated NodeInfo members = 3;
  string job_id = 4;
  repeated IslandRoute routes = 5; // ilha -> nó responsável (topologia do anel)
  int64 store_version = 6;
}

message HeartbeatReply {
  Header h = 1;
  bool ok = 2;
  int64 store_version = 3;
  repeated int32 running_islands = 4;
  string job_id = 5;
}

// ---------------------------------------------------------------- relógios (Berkeley)

message TimeRequest {
  Header h = 1;
  int32 round = 2;
}

message TimeReply {
  Header h = 1;
  double time = 2;    // relógio sincronizado do nó (SO + desvio + correção)
  double os_time = 3; // relógio do sistema operacional, sem correções
}

message AdjustRequest {
  Header h = 1;
  int32 round = 2;
  double delta = 3; // correção, em segundos, a somar ao relógio do nó
}

// ---------------------------------------------------------------- replicação

message ReplicationRequest {
  Header h = 1;
  int64 base_version = 2; // versão que o seguidor precisa ter para aplicar o delta
  int64 version = 3;      // versão resultante após aplicar
  bool full = 4;          // true = snapshot completo (substitui tudo)
  bytes delta = 5;        // JSON comprimido com zlib
}

message ReplicationReply {
  Header h = 1;
  bool ok = 2;
  int64 version = 3;
  bool need_full = 4;
}

// ---------------------------------------------------------------- algoritmo genético

message JobRequest {
  Header h = 1;
  bytes spec_json = 2;
}

message JobReply {
  Header h = 1;
  bool ok = 2;
  string job_id = 3;
  string info = 4;
  int32 leader_id = 5;
  string leader_address = 6;
}

message IslandAssignment {
  Header h = 1;
  string job_id = 2;
  int32 island_id = 3;
  bytes spec_json = 4;   // parâmetros do AG + coordenadas das cidades
  int32 start_epoch = 5; // > 0 quando a ilha é retomada de um checkpoint
  bytes population = 6;  // checkpoint (int16 little-endian), vazio = população nova
}

message Migration {
  Header h = 1;
  string job_id = 2;
  string msg_id = 3;
  int32 from_island = 4;
  int32 to_island = 5;
  int32 epoch = 6;
  int32 n_cities = 7;
  bytes tours = 8; // melhores indivíduos da ilha de origem (int16 little-endian)
}

message ProgressReport {
  Header h = 1;
  string job_id = 2;
  int32 island_id = 3;
  int32 epoch = 4;          // épocas concluídas
  double best_length = 5;
  bytes best_tour = 6;
  bytes population = 7;     // checkpoint da ilha
  bool finished = 8;
  double compute_seconds = 9;
  int32 generations = 10;
}

message CancelRequest {
  Header h = 1;
  string job_id = 2;
  int32 island_id = 3; // -1 = todas as ilhas do job
}

// ---------------------------------------------------------------- teste/operação

message StartTestRequest {
  Header h = 1;
  string requested_by = 2;
  bytes options_json = 3;
}

message CrashRequest {
  Header h = 1;
  string reason = 2;
}

service ArquipelagoNode {
  // Pertencimento e eleição de líder (Bully)
  rpc Join(JoinRequest) returns (JoinReply);
  rpc Election(ElectionRequest) returns (ElectionReply);
  rpc Coordinator(CoordinatorAnnounce) returns (Ack);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Ping(PingRequest) returns (PingReply);
  rpc AddPeer(PeerRequest) returns (Ack);

  // Sincronização de relógios físicos (Berkeley)
  rpc GetTime(TimeRequest) returns (TimeReply);
  rpc AdjustTime(AdjustRequest) returns (Ack);

  // Replicação do estado do coordenador (primário-backup)
  rpc Replicate(ReplicationRequest) returns (ReplicationReply);

  // Algoritmo genético em ilhas
  rpc SubmitJob(JobRequest) returns (JobReply);
  rpc AssignIsland(IslandAssignment) returns (Ack);
  rpc Migrate(Migration) returns (Ack);
  rpc ReportProgress(ProgressReport) returns (Ack);
  rpc CancelJob(CancelRequest) returns (Ack);

  // Bateria de testes e operação
  rpc StartTest(StartTestRequest) returns (Ack);
  rpc InjectCrash(CrashRequest) returns (Ack);
  rpc GetStatus(Empty) returns (JsonReply);
  rpc GetEvents(Empty) returns (JsonReply);
}
